# External MinIO override for the minified development stack.
# Use after docker-compose.yaml and docker-compose.min.yaml.
services:
  minio:
    profiles: ["internal-minio"]

  workspace_cockroach:
    links: !override
      - cockroach
    environment:
      BACKUP_STORAGE_KIND: "minio"
      BACKUP_STORAGE_ENDPOINT: "${EXTERNAL_MINIO_ENDPOINT}"
      BACKUP_STORAGE_ACCESS_KEY: "${EXTERNAL_MINIO_ACCESS_KEY}"
      BACKUP_STORAGE_SECRET_KEY: "${EXTERNAL_MINIO_SECRET_KEY}"

  collaborator:
    links: !override
      - transactor_cockroach

  transactor_cockroach:
    links: !override
      - cockroach
      - account

  export:
    links: !override []

  datalake:
    depends_on: !override
      cockroach:
        condition: service_started
      account:
        condition: service_started
    environment:
      BUCKET_NAME: "blobs"
      BUCKET_LOCATION: "eu"
      BUCKET_ENDPOINT: "${EXTERNAL_MINIO_URL}"
      BUCKET_ACCESS_KEY: "${EXTERNAL_MINIO_ACCESS_KEY}"
      BUCKET_SECRET_KEY: "${EXTERNAL_MINIO_SECRET_KEY}"

  hulylake:
    depends_on: !override
      cockroach:
        condition: service_started
    environment:
      AWS_ENDPOINT_URL: "${EXTERNAL_MINIO_URL}"
      AWS_REGION: "${EXTERNAL_MINIO_REGION}"
      AWS_ACCESS_KEY_ID: "${EXTERNAL_MINIO_ACCESS_KEY}"
      AWS_SECRET_ACCESS_KEY: "${EXTERNAL_MINIO_SECRET_KEY}"
